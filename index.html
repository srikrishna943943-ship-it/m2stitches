<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M2 Stitches</title>
    <!-- Puranakathaigal Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&family=Hind+Madurai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <style>
        /* Puranakathaigal Colors & Box Model */
        :root {
            --primary: #B3181E;
            --primary-dark: #7E0F13;
            --bg-color: #FFF8EF;
            --text-dark: #241512;
            --card-border: #ECE0CC;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Hind Madurai', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-color);
            padding-bottom: 70px; /* Space for bottom nav */
        }

        h1, h2, h3 { font-family: 'Baloo Thambi 2', sans-serif; margin: 0; }

        /* Header */
        header {
            background: var(--white);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 3px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        header img {
            width: 44px; height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }
        .brand-text { font-size: 1.4rem; color: var(--primary); font-weight: 700; display: block; font-family: 'Baloo Thambi 2', sans-serif;}
        .brand-sub { font-size: 0.68rem; color: #5A4A45; text-transform: uppercase; letter-spacing: 1px; display: block; }

        /* Sections */
        .section { display: none; padding: 20px; animation: fadeIn 0.3s ease; max-width: 600px; margin: 0 auto;}
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 1.4rem; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 14px; }
        .section-title::after { content: ''; flex: 1; height: 2px; background: var(--card-border); }

        /* Box Model Cards (Like Puranakathaigal) */
        .card {
            background: var(--white);
            border-radius: 10px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 4px 8px rgba(179, 24, 30, 0.05);
            transition: transform 0.2s;
        }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #FBF1DC; }
        .card-body { padding: 16px 18px; }
        .card-tag { display: inline-block; background: var(--primary); color: white; font-size: 0.7rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; margin-bottom: 8px; }
        .card-title { font-size: 1.15rem; color: var(--text-dark); margin-bottom: 8px; line-height: 1.4; }
        .card-price { font-size: 1.2rem; color: var(--primary); font-weight: 700; font-family: 'Baloo Thambi 2', sans-serif; margin-bottom: 15px; }
        
        .btn { display: block; width: 100%; text-align: center; padding: 10px 22px; border-radius: 999px; font-weight: 700; font-size: 1rem; background: var(--primary); color: white; border: none; cursor: pointer; font-family: 'Baloo Thambi 2', sans-serif;}

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--white); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--card-border); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #8a7268; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        /* Login Modal for Buy Button */
        .modal { display: none; position: fixed; inset: 0; background: rgba(36, 21, 18, 0.85); z-index: 200; align-items: center; justify-content: center; }
        .modal-box { background: var(--bg-color); width: 90%; max-width: 360px; padding: 25px; border-radius: 15px; position: relative; border: 2px solid var(--primary); text-align: center;}
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: var(--primary-dark); font-weight: bold;}
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--card-border); border-radius: 8px; font-family: 'Hind Madurai', sans-serif; font-size: 1rem; outline: none;}
        input:focus { border-color: var(--primary); }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <img src="icon-192.png" alt="M2 Logo">
        <div>
            <span class="brand-text">M2 Stitches</span>
            <span class="brand-sub">Learn Professional Tailoring</span>
        </div>
    </header>

    <!-- HOME TAB (Direct Opening) -->
    <main id="home" class="section active">
        <h2 class="section-title">சிறப்பு வகுப்புகள்</h2>
        <div id="course-list">
            <p style="color:#8a7268; text-align:center;">Loading Courses...</p>
        </div>
    </main>

    <!-- STORE TAB -->
    <main id="store" class="section">
        <h2 class="section-title">Store (பொருட்கள்)</h2>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1574342270966-24b584d471b0?q=80&w=800&auto=format&fit=crop" alt="Scissor" class="card-img">
            <div class="card-body">
                <span class="card-tag">Tool</span>
                <h3 class="card-title">Professional Tailoring Scissor</h3>
                <div class="card-price">₹ 450</div>
                <button class="btn" onclick="checkLoginAndBuy('Scissor')">Buy Product</button>
            </div>
        </div>
    </main>

    <!-- PROFILE / OWNER TAB -->
    <main id="profile" class="section">
        <h2 class="section-title">My Account</h2>
        <p style="color:#8a7268; margin-bottom: 20px;">நீங்கள் வாங்கிய வகுப்புகளை இங்கே காணலாம்.</p>
        
        <div id="profile-content">
            <button class="btn" onclick="openLogin()">Login to view your courses</button>
        </div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </div>
        <div class="nav-item" onclick="switchTab('store', this)">
            <svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
            Store
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Profile
        </div>
    </nav>

    <!-- LOGIN MODAL (Appears only on Buy) -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <div class="close-btn" onclick="closeLogin()">×</div>
            <h2 style="color: var(--primary); margin-bottom: 10px;">Login</h2>
            <p style="font-size: 0.9rem; color: #8a7268; margin-bottom: 20px;">வகுப்புகளை வாங்க உங்கள் மொபைல் எண்ணை உள்ளிடவும்.</p>
            
            <input type="tel" id="mobileNumber" placeholder="Mobile Number (ex: 9876543210)">
            <div id="otpGroup" style="display:none;">
                <input type="number" id="otpCode" placeholder="Enter OTP (Enter any 4 digits)">
            </div>
            
            <button class="btn" id="loginActionBtn" onclick="requestOTP()">Get OTP</button>
        </div>
    </div>

    <script>
        // Supabase Setup
        const SB_URL = "https://ykwfhtsphqyrscojclhk.supabase.co";
        const SB_KEY = "sb_publishable_4w_bwrUQOBY60Zauc2pDiw_ommX-WQD";
        const sb = supabase.createClient(SB_URL, SB_KEY);
        
        let isLoggedIn = false;
        let pendingItem = null;

        // Fetch Courses Automatically without login
        async function fetchCourses() {
            const { data: courses, error } = await sb.from("courses").select("*").order("id");
            let courseHTML = "";
            
            if (courses && courses.length > 0) {
                courses.forEach(c => {
                    courseHTML += `
                        <div class="card">
                            <img src="https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?q=80&w=800&auto=format&fit=crop" alt="Class" class="card-img">
                            <div class="card-body">
                                <span class="card-tag">Course</span>
                                <h3 class="card-title">${c.title}</h3>
                                <div class="card-price">₹ ${c.price} ${c.old_price ? `<span style="font-size:0.8rem; text-decoration:line-through; color:#8a7268; margin-left:8px;">₹ ${c.old_price}</span>` : ''}</div>
                                <button class="btn" onclick="checkLoginAndBuy('${c.title}')">Buy Now</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                // Default Dummy Course if Supabase is empty
                courseHTML = `
                    <div class="card">
                        <img src="https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?q=80&w=800&auto=format&fit=crop" alt="Class" class="card-img">
                        <div class="card-body">
                            <span class="card-tag">New</span>
                            <h3 class="card-title">A-Z Blouse Cutting & Stitching</h3>
                            <div class="card-price">₹ 999</div>
                            <button class="btn" onclick="checkLoginAndBuy('A-Z Blouse Cutting')">Buy Now</button>
                        </div>
                    </div>
                `;
            }
            document.getElementById('course-list').innerHTML = courseHTML;
        }

        fetchCourses();

        // UI Functions
        function switchTab(tabId, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            element.classList.add('active');
            window.scrollTo(0,0);
        }

        function checkLoginAndBuy(itemName) {
            if (!isLoggedIn) {
                pendingItem = itemName;
                document.getElementById('loginModal').style.display = 'flex';
            } else {
                alert("Opening payment for: " + itemName);
                // Here we will add QR code payment later
            }
        }

        function openLogin() { document.getElementById('loginModal').style.display = 'flex'; }
        
        function closeLogin() { 
            document.getElementById('loginModal').style.display = 'none'; 
            document.getElementById('otpGroup').style.display = 'none';
            document.getElementById('loginActionBtn').innerText = 'Get OTP';
            document.getElementById('loginActionBtn').setAttribute('onclick', 'requestOTP()');
        }

        function requestOTP() {
            let mob = document.getElementById('mobileNumber').value;
            if(mob.length >= 10) {
                document.getElementById('loginActionBtn').innerText = 'Sending...';
                setTimeout(() => {
                    document.getElementById('otpGroup').style.display = 'block';
                    document.getElementById('loginActionBtn').innerText = 'Verify OTP';
                    document.getElementById('loginActionBtn').setAttribute('onclick', 'verifyOTP()');
                }, 800);
            } else {
                alert("சரியான 10-இலக்க எண்ணை உள்ளிடவும்.");
            }
        }

        function verifyOTP() {
            let otp = document.getElementById('otpCode').value;
            if(otp.length >= 4) {
                isLoggedIn = true;
                closeLogin();
                document.getElementById('profile-content').innerHTML = '<p style="color:var(--primary); font-weight:bold;">Login Successful! 🎉<br><br>No courses purchased yet.</p>';
                if(pendingItem) {
                    alert("Opening payment for: " + pendingItem);
                    pendingItem = null;
                }
            } else {
                alert("சரியான OTP எண்ணை உள்ளிடவும்.");
            }
        }
    </script>
</body>
</html>
